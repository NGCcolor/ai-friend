  chat_model_name: mimo-v2.5-pro
  chat_api_key: tp-cc5hpv3av4xo9bi0qxbjyob5i4u3ng3itxpwikh10h24qwxn
  chat_base_url: https://token-plan-cn.xiaomimimo.com/v1
  embedding_model_name: text-embedding-v4
  embedding_api_key: sk-5a198bfa388c46f68955df8dbbd9ce20

# Agent 配置
